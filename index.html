<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EmTech Reviewer</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}h1{font-size:18px;margin:0}
.xp{background:var(--p);color:#fff;border-radius:99px;padding:3px 12px;font-weight:700}
nav{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto}nav button{flex:1;min-width:64px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:6px 4px;font-size:12px;font-weight:700}nav button.on{background:var(--p);color:#fff;border-color:var(--p)}nav b{display:block;font-size:20px}
main{padding:6px 12px 40px;max-width:640px;margin:auto}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{flex:none;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:4px 8px;font-size:12px}.chips button.on{border-color:var(--a);background:var(--a);color:#fff}
.btn{border:0;background:var(--p);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px;margin:3px}.btn.o{background:var(--card);color:var(--tx);border:2px solid var(--bd)}.btn.g{background:var(--g)}.btn.on{background:var(--a)}
.stage{text-align:center;min-height:250px;position:relative;overflow:hidden}.lab{display:inline-block;background:var(--a);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
.big{font-size:56px;animation:bob 1.4s ease-in-out infinite}.txt{font-size:20px;font-weight:700;margin:6px 0}
.txt span{display:inline-block;opacity:0;animation:pop .5s forwards}.txt.step span{animation-name:slide}.txt.ex span{animation-name:drop}.txt.end span{animation-name:pop}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);animation:fill linear forwards}
.rib{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}.rib span{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--bd);color:var(--mut)}.rib span.on{background:var(--p);color:#fff;animation:pulse .8s infinite}
.tl{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.tl b{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--bd);color:var(--mut)}.tl b.on{background:var(--a);color:#fff}
.flip{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:18px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}details{border:2px solid var(--bd);border-radius:14px;padding:8px 12px;margin:8px 0;background:var(--card)}summary{font-weight:700}
input[type=text],input:not([type]){width:100%;padding:10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font-size:15px}.opt.ok{background:var(--g);color:#fff}.opt.no{background:#e5484d;color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:5px;text-align:left}
.mock{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:13px}.bx{background:var(--bd);border-radius:10px;padding:6px 10px;animation:pop .6s both}.bx.r{background:#e5484d;color:#fff}.bx.y{background:#f5b301;color:#222}.bx.b{background:var(--p);color:#fff}.bx.g{background:var(--g);color:#fff}.sw{width:24px;height:24px;border-radius:50%;display:inline-block;animation:pulse 1s infinite}.gr{width:auto;margin:8px auto;font-size:13px}.gr td{border:1px solid var(--mut);padding:4px 10px;text-align:center}.gr td.g{background:var(--g);color:#fff}.gr td.r{background:#e5484d;color:#fff}.bars{align-items:flex-end;height:100px}.bars i{width:30px;background:var(--a);border-radius:6px 6px 0 0;transform-origin:bottom;animation:grow 1s both}.pg{border:2px solid var(--mut);padding:6px 14px;border-radius:6px;font-size:12px;background:var(--card)}@keyframes grow{from{transform:scaleY(0)}}
.app{border:2px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card);margin:8px 0}.tb{color:#fff;padding:6px 10px;font-size:13px}.tabs{display:flex;overflow-x:auto;gap:2px;padding:4px 6px 0;background:var(--bd)}.tabs span{padding:5px 10px;font-size:13px;white-space:nowrap;border-radius:6px 6px 0 0}.tabs span.on{background:var(--card);font-weight:700}.rb{display:flex;gap:6px;overflow-x:auto;padding:8px}.cmd{min-width:80px;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:6px 4px;background:var(--bg)}.cmd b{display:block;font-size:22px}.cmd small{font-size:11px}.cmd.on{outline:3px solid var(--a);animation:pulse .8s infinite}.sheet{padding:10px;background:var(--bg);min-height:90px}.shake{animation:sh .3s}.opt.sel{border-color:var(--p);background:var(--p);color:#fff}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 1.8s ease-in forwards;pointer-events:none;z-index:9}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-30px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

@keyframes fill{from{width:0}to{width:100%}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

main{padding-right:46px}
.qc{border-left:6px solid var(--c);padding:12px;box-shadow:0 3px 10px #0001;animation:slide .35s both}
.qh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.qh b{font-size:17px}.qh small{color:var(--c);font-weight:700}
.qe{flex:none;font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent)}
.qk{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.qr1{background:color-mix(in srgb,var(--p) 14%,transparent);border-radius:12px;padding:8px 10px;font-weight:600;font-size:14px}
.qw{align-self:flex-start;border:2px solid var(--c);color:var(--c);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
.qs{display:flex;flex-direction:column;gap:5px}.qs span{display:flex;gap:8px;align-items:center;font-size:14px}
.qs b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px}
.qa{background:color-mix(in srgb,#f5b301 20%,transparent);border-left:4px solid #f5b301;border-radius:8px;padding:6px 10px;font-size:14px}
#bk{position:fixed;right:0;top:38%;transform:translateY(-38%);display:flex;flex-direction:column;gap:6px;z-index:8}
#bk button{writing-mode:vertical-rl;border:2px solid var(--bd);border-right:0;background:var(--card);color:var(--tx);border-radius:12px 0 0 12px;padding:10px 5px;font-weight:700;font-size:13px;transform:translateX(5px);box-shadow:-2px 2px 6px #0002;padding-right:calc(5px + env(safe-area-inset-right,0px))}
#bk button.on{color:#fff;transform:none;padding-left:9px;border-color:transparent}
.tc{border:2px solid var(--c);border-radius:14px;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:14px;background:color-mix(in srgb,var(--c) 7%,transparent)}.tc>div{display:flex;gap:8px;align-items:flex-start}.tc>div>span{flex:none;min-width:92px;font-weight:700;color:var(--c);font-size:13px}.tc .tm{align-self:flex-start;margin:2px 0 0;padding:5px 12px;font-size:13px;background:var(--c)}
.tc .bt{flex-wrap:wrap}.tc .tr{margin-top:6px;justify-content:flex-start}
body.t main{padding-bottom:250px}
#spot{position:fixed;z-index:20;pointer-events:none;border-radius:14px;box-shadow:0 0 0 100vmax rgba(15,10,40,.58);outline:3px solid var(--a);transition:opacity .3s}#spot.off{opacity:0}
#tptr{position:fixed;left:0;top:0;z-index:40;pointer-events:none;display:none}#tptr b{display:block;font-size:30px;line-height:1;animation:poke 1s ease-in-out infinite;filter:drop-shadow(0 3px 3px #0006)}#tptr i{position:absolute;left:5px;top:0;width:20px;height:20px;border-radius:50%;border:3px solid var(--a);opacity:0}#tptr.tap i{animation:rip .7s ease-out}
@keyframes poke{50%{transform:translateY(-6px) rotate(-6deg)}}@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.2);opacity:0}}
#tdock{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;display:none;grid-template-columns:52px 1fr;gap:4px 10px;align-items:start;background:var(--card);border:2px solid var(--p);border-radius:18px;padding:8px 10px;box-shadow:0 6px 22px #0005}
#tav{font-size:44px;line-height:1;transform-origin:50% 90%;animation:talk 1s ease-in-out infinite}
#tav.g-wave{animation:wave 1.2s ease-in-out,talk 1s ease-in-out 1.2s infinite}#tav.g-cheer{animation:cheer 1.1s ease-in-out,talk 1s ease-in-out 1.1s infinite}#tav.g-point{animation:lean .8s ease-in-out,talk 1s ease-in-out .8s infinite}#tav.g-warn{animation:sh .3s 3,talk 1s ease-in-out .9s infinite}
#tdock.pz #tav{animation-play-state:paused}
@keyframes talk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
@keyframes wave{20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-14deg)}80%{transform:rotate(10deg)}}
@keyframes cheer{40%{transform:translateY(-28px) rotate(180deg) scale(1.2)}80%{transform:translateY(0) rotate(360deg)}}
@keyframes lean{50%{transform:translateX(12px) rotate(9deg)}}
#tmeta{min-width:0}#tlab{color:var(--mut);font-size:11px;font-weight:700}#tbub{font-size:15px;font-weight:600;max-height:7.5em;overflow-y:auto;margin-top:2px}.say span{display:inline-block;opacity:0;animation:pop .4s forwards}
#tctl{grid-column:1/3;display:flex;justify-content:center;gap:2px}#tctl .btn{padding:6px 9px;font-size:14px;margin:1px;min-width:38px}#tdock .bar{grid-column:1/3;margin:2px 0 0}
</style></head><body>
